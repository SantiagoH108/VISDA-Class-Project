<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VISDA – Live View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #121212;
      color: #f5f5f5;
    }

    header {
      padding: 10px 16px;
      background: #1f2933;
      border-bottom: 1px solid #111827;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    main {
      max-width: 900px;
      margin: 16px auto;
      padding: 0 12px 24px;
    }

    .card {
      background: #1f2933;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #111827;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 500;
    }

    .video-container {
      width: 100%;
      overflow: hidden;
      border-radius: 6px;
      background: #000;
    }

    .video-container img {
      width: 100%;
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      margin-top: 8px;
    }

    th, td {
      padding: 6px 8px;
      border-bottom: 1px solid #111827;
      text-align: left;
    }

    th {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #d1d5db;
    }

    .empty-row {
      color: #9ca3af;
      font-style: italic;
    }

    .status-text {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 4px;
    }

    .status-error {
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <header>
    <h1>VISDA – Live Object Detection</h1>
  </header>

  <main>
    <div class="card">
      <h2>Camera</h2>
      <div class="video-container">
        <img id="video" src="/video" alt="Live stream" />
      </div>
      <div class="status-text" id="videoStatus"></div>
    </div>

    <div class="card">
      <h2>Detections</h2>
      <table>
        <thead>
          <tr>
            <th>Label</th>
            <th>Confidence</th>
          </tr>
        </thead>
        <tbody id="detTable">
          <tr class="empty-row">
            <td colspan="2">No detections yet.</td>
          </tr>
        </tbody>
      </table>
      <div class="status-text" id="statusMessage"></div>
    </div>
  </main>

  <script>
    (function () {
      const detTable = document.getElementById("detTable");
      const statusMessage = document.getElementById("statusMessage");
      const video = document.getElementById("video");
      const videoStatus = document.getElementById("videoStatus");

      function setStatus(msg, isError) {
        statusMessage.textContent = msg || "";
        statusMessage.className = "status-text" + (isError ? " status-error" : "");
      }

      async function pollStatus() {
        try {
          const res = await fetch("/status", { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();

          const dets = Array.isArray(data.dets) ? data.dets : [];

          // Clear table
          detTable.innerHTML = "";

          if (!dets.length) {
            const tr = document.createElement("tr");
            tr.className = "empty-row";
            tr.innerHTML = `<td colspan="2">No detections.</td>`;
            detTable.appendChild(tr);
          } else {
            dets.slice(0, 10).forEach(d => {
              // d can be [label, conf] or [label, conf, bbox...]
              const label = d[0];
              const conf = d[1];

              const tr = document.createElement("tr");
              tr.innerHTML = `
                <td>${label}</td>
                <td>${(conf * 100).toFixed(1)}%</td>
              `;
              detTable.appendChild(tr);
            });
          }

          setStatus("", false);
        } catch (err) {
          console.error("Status poll error:", err);
          setStatus("Failed to fetch status: " + err.message, true);
        }
      }

      // Simple video load/error hints
      video.addEventListener("load", () => {
        videoStatus.textContent = "";
      });

      video.addEventListener("error", () => {
        videoStatus.textContent = "Could not load video stream. Check that the VISDA server and camera are running.";
      });

      // Start polling
      pollStatus();
      setInterval(pollStatus, 700);
    })();
  </script>
</body>
</html>
